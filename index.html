    <!-- ============================================================
         ANALYTICS & TRACKING
         Order matters: Consent Mode default (denied) must run BEFORE
         any tracker (gtag / GTM / Pixel) loads.
         ============================================================ -->

    <!-- 1) Google Consent Mode v2 — default everything DENIED.
         GA4 runs in cookieless/modeling mode until consent is granted.
         The future cookie-consent banner must call, on "accept":
           gtag('consent', 'update', {
             ad_storage: 'granted', ad_user_data: 'granted',
             ad_personalization: 'granted', analytics_storage: 'granted'
           });
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
    </script>

    <!-- 2) GA4 via gtag.js (reuses the gtag() defined above — do NOT redefine dataLayer) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RQNHXJVXZ1"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-RQNHXJVXZ1');
    </script>

    <!-- 3) PLACEHOLDER — Google Tag Manager (paste GTM-XXXXXXX when the container exists).
         When you activate GTM, add the Meta Pixel as a GTM tag firing on the
         `lead_submit` dataLayer event. Do NOT add a second GA4 tag inside GTM —
         gtag above already covers GA4 (would double-count). Also paste the matching
         <noscript> iframe just after <body> (see placeholder in <body> below).
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    -->

    <!-- 4) Meta (Facebook) Pixel — Eesti Maakeskus (ID 2475051009627720).
         Consent-aware: starts revoked so nothing fires until the cookie-consent
         banner calls fbq('consent','grant') on accept (mirrors Consent Mode v2 above).
         Verify firing with the Meta Pixel Helper Chrome extension. -->
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('consent', 'revoke');
      fbq('init', '2475051009627720');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2475051009627720&ev=PageView&noscript=1"
      /></noscript>
    <!-- End Meta Pixel Code -->
